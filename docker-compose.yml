services:
  kafka:
    image: bitnamilegacy/kafka:3.9
    container_name: nexusguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - nexusguard-kafka-data:/bitnami/kafka

  nifi:
    image: apache/nifi:2.0.0
    container_name: nexusguard-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Set NIFI_PASSWORD before starting NiFi}
    volumes:
      - nexusguard-nifi-conf:/opt/nifi/nifi-current/conf
      - nexusguard-nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nexusguard-nifi-content:/opt/nifi/nifi-current/content_repository
      - nexusguard-nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - nexusguard-nifi-database:/opt/nifi/nifi-current/database_repository

volumes:
  nexusguard-kafka-data:
  nexusguard-nifi-conf:
  nexusguard-nifi-flowfile:
  nexusguard-nifi-content:
  nexusguard-nifi-provenance:
  nexusguard-nifi-database:
